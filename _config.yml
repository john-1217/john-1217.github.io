# Hexo 站点配置
title: 易中
subtitle: ''
description: 易中的个人博客 · 记录技术、思考与生活
keywords: 技术博客, 美团, 前端, 易中
author: 易中
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
url: https://john-1217.github.io
permalink: posts/:title/
permalink_defaults:

# 目录
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# 写作
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js

# 分页
per_page: 10
pagination_dir: page

# 主题
theme: stellar

# 部署（通过 GitHub Actions 发布，本地不部署）
deploy:
  type: ''
